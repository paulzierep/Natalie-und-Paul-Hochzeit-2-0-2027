name: Website prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Website prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inhalte und lokale Links prüfen
        run: python scripts/check_site.py
      - name: Website für die Veröffentlichung vorbereiten
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -R assets _site/
      - name: Website als Artefakt hochladen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    name: GitHub Pages veröffentlichen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
